<style>
  /* Laid out as the guide of the drivers that search (drivers/sg_mesh/pair/
     guide.html): a picture on top and the points under it, numbered, all
     centred. Text is Homey's own (Athom:
     advanced/custom-views/html-and-css-styling.md). */
  .sg-guide { display: flex; flex-direction: column; align-items: center; }
  .sg-picture { display: flex; justify-content: center; align-items: center; width: 100%;
    height: clamp(80px, calc(100vh - 229px), 200px); margin-bottom: 8px; }
  .sg-picture[hidden] { display: none; }
  .sg-picture img { display: block; max-height: 100%; max-width: 100%; }
  .sg-steps { list-style: none; margin: 0; padding: 0; max-width: 340px; counter-reset: step; }
  .sg-steps li { display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
    text-align: start; counter-increment: step; }
  .sg-steps li[hidden] { display: none; }
  .sg-steps li::before { content: counter(step); flex: none; box-sizing: border-box;
    width: 24px; height: 24px; border: 1.5px solid currentColor; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
</style>

<div class="sg-guide">
  <div class="sg-picture">
    <img src="../assets/guide/guide.png" alt="">
  </div>
  <ol class="sg-steps">
    <li data-step="addFirst"></li>
    <li data-step="account"></li>
    <li data-step="closeApp"></li>
    <li data-step="near" hidden></li>
    <li data-step="names" hidden></li>
  </ol>
</div>

<script type="application/javascript">
  // Before the list of the 3.0 dimmers (Athom: the-basics/devices/pairing.md,
  // navigation, and advanced/custom-views/custom-pairing-views.md,
  // Homey.emit). The points follow the SG account (drivers/sg3_dimmer/
  // driver.js, the account handler):
  // - keys kept (keys): add new dimmers in the SG app first; close the SG app
  //   on the phone; keep Homey close, the search takes about 10 s; and, for
  //   the names from the SG app, "Fetch again" first;
  // - otherwise: add new dimmers in the SG app first; the button on the
  //   settings page, "Log in and fetch" while no SG account is fetched,
  //   "Fetch again" once one is (fetched before 2.8.0); close the SG app.
  // Until the answer comes, the second, with "Log in and fetch".
  Homey.setTitle(Homey.__('pair.sg3Guide.title'));
  document.querySelector('[data-step="addFirst"]').textContent = Homey.__('pair.sg3Guide.addFirst');
  const account = document.querySelector('[data-step="account"]');
  account.textContent = Homey.__('pair.sg3Guide.loginFirst');
  document.querySelector('[data-step="closeApp"]').textContent = Homey.__('pair.sg3Guide.closeApp');
  const near = document.querySelector('[data-step="near"]');
  near.textContent = Homey.__('pair.sg3Guide.near');
  const names = document.querySelector('[data-step="names"]');
  names.textContent = Homey.__('pair.sg3Guide.names');
  Homey.emit('account').then((answer) => {
    if (answer && answer.keys === true) {
      account.hidden = true;
      near.hidden = false;
      names.hidden = false;
    } else if (answer && answer.fetched === true) {
      account.textContent = Homey.__('pair.sg3Guide.fetchAgain');
    }
  }).catch(() => {});
  // The picture is assets/guide/guide.png in this driver; without it, its room
  // goes.
  const picture = document.querySelector('.sg-picture img');
  const hide = () => { picture.parentElement.hidden = true; };
  picture.addEventListener('error', hide);
  if (picture.complete && picture.naturalWidth === 0) hide();
</script>
